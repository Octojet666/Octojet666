name: Haunt my graph
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  haunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Octojet666/haunted-contribution-graph@main
        with:
          output_branch: haunted
